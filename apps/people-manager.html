<title>People Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>/* Layout: app bar with Staff|HR toggle, tab row, single content column (list + detail split on wide screens) */
:root{
  --bg:#f6f4f4; --surface:#ffffff; --surface-2:#f0ecec; --line:#e2dbdb; --ink:#1a1416; --muted:#6b5f62;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe9ec; --black:#1a1416;
  --ok:#1d7a46; --ok-soft:#e3f3e9; --warn:#a15c00; --warn-soft:#fbf0dc; --info:#355c9a; --info-soft:#e6edf8; --grey-soft:#ece8e8;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Public Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1d181a; --surface-2:#262022; --line:#352d30; --ink:#f3eeef; --muted:#a8999d;
  --red:#ef4f66; --red-ink:#1a0a0d; --red-soft:#3a1a20; --black:#000000;
  --ok:#6fd39a; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2a12; --info:#8fb3ef; --info-soft:#1c2840; --grey-soft:#2c2528; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1d181a; --surface-2:#262022; --line:#352d30; --ink:#f3eeef; --muted:#a8999d;
  --red:#ef4f66; --red-ink:#1a0a0d; --red-soft:#3a1a20; --black:#000000;
  --ok:#6fd39a; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2a12; --info:#8fb3ef; --info-soft:#1c2840; --grey-soft:#2c2528; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1a1416}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:#1a1416;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid #c8102e}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:36px;height:36px;border-radius:6px;background:#c8102e;display:grid;place-items:center;font:700 15px var(--f-display);flex:none}
.app{font:700 18px/1.2 var(--f-display);letter-spacing:.01em}
.sub{font-size:12px;color:#c9bcbf;letter-spacing:.04em;text-transform:uppercase}
.toggle{display:flex;background:#2e2629;border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;color:#d8cdd0;font:600 14px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:#c8102e;color:#fff}
.toggle button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.who{font-size:12px;color:#c9bcbf;width:100%;display:flex;gap:6px;flex-wrap:wrap}
.who b{color:#fff;font-weight:600}
.proto{background:var(--surface-2);color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.proto .wrap{padding-block:6px}
.tabs{border-bottom:1px solid var(--line);background:var(--surface)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:12px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:21px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.card:hover{border-color:var(--red)}
.card[aria-current="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.card .t{font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--red-soft)}
.row .t{font-weight:600;min-width:0}
.row .m{grid-column:1/-1;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--grey-soft);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--info-soft);color:var(--info)}
.s-prog{background:var(--warn-soft);color:var(--warn)}
.s-need{background:var(--red-soft);color:var(--red)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-off{background:var(--grey-soft);color:var(--muted)}
label{font-weight:600;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.hint{font-weight:400;color:var(--muted);font-size:12.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500}
.check input{width:auto;margin-top:3px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:8px;background:var(--surface-2);max-width:90%;font-size:14px}
.msg.me{align-self:flex-end;background:var(--red-soft)}
.msg.note{background:var(--warn-soft);border:1px dashed var(--warn);max-width:100%}
.msg .by{font-size:12px;color:var(--muted);margin-bottom:2px}
.callout{border-left:3px solid var(--red);background:var(--red-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.callout.info{border-color:var(--info);background:var(--info-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:3px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.letter{background:#fff;color:#1a1416;border:1px solid var(--line);border-radius:4px;padding:28px;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.6;display:flex;flex-direction:column;gap:12px}
.letter .lh{display:flex;justify-content:space-between;border-bottom:2px solid #c8102e;padding-bottom:8px;font-family:var(--f-display);font-size:13px}
.letter .locked{background:#f3f0f0;border-radius:3px;padding:0 3px}
.letter textarea{font:inherit;color:#1a1416;background:#fff8e6;border:1px dashed #a15c00}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.scrim{position:fixed;inset:0;background:rgba(10,6,8,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:36px;height:36px;cursor:pointer;font-weight:700;color:var(--ink)}
.stars button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.card,.row,.btn{transition:border-color .15s,background .15s}}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font:inherit;text-decoration:underline;cursor:pointer}
.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.step:first-child{border-top:0}
.stage{display:flex;gap:4px;flex-wrap:wrap}
.stage span{font-size:12px;padding:4px 10px;border-radius:4px;background:var(--surface-2);color:var(--muted);font-weight:600}
.stage span.on{background:var(--ink);color:var(--surface)}
.stage span.done{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);margin:0 4px 4px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filters label{min-width:150px;flex:1}
.fields > .btns{align-self:end}
.viewnote{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.vchip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.subtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.subtoggle button{border:0;background:none;padding:5px 12px;border-radius:999px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.subtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
</style>
<header class="bar"><div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true">PM</span><div><div class="app">People Manager</div><div class="sub">People &amp; Culture · Manager guidance and ER cases</div></div></div>

</div></header>

<main id="main"><div class="wrap"></div></main>

<script>
// Shared shell: Staff|HR toggle, tabs, actions, modal, toast
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const UI = { view: 'staff', tab: null };
const VIEW_NAMES = { staff: 'Staff', manager: 'Manager', hr: 'HR' };
const pill = (status) => `<span class="pill ${APP.statusClass[status] || 's-off'}">${esc(status)}</span>`;
const today = new Date();
const fmtDate = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const daysAgo = n => { const d = new Date(today); d.setDate(d.getDate() - n); return d.toISOString(); };
const ageDays = d => Math.max(0, Math.round((today - new Date(d)) / 86400000));
// Reference numbers: <PREFIX>/<YEAR>/<4-digit sequence>, sequential per prefix and year, never reused or edited
function makeRef(prefix) {
  S.counters = S.counters || {};
  const n = (S.counters[prefix] = (S.counters[prefix] ?? (APP.refBase?.[prefix] || 0)) + 1);
  return `${prefix}/${today.getFullYear()}/${String(n).padStart(4, '0')}`;
}
// Working days: Maldives weekend is Friday and Saturday
function addWorkDays(from, n) {
  const d = new Date(from); let added = 0;
  while (added < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 5 && w !== 6) added++; }
  return d.toISOString();
}
function duePill(due, doneAt) {
  if (doneAt) return `<span class="pill s-done">Done ${fmtDate(doneAt)}</span>`;
  const days = Math.round((new Date(due) - today) / 86400000);
  if (days < 0) return `<span class="pill s-need">Overdue ${-days} d</span>`;
  if (days <= 2) return `<span class="pill s-prog">Due ${days === 0 ? 'today' : 'in ' + days + ' d'}</span>`;
  return `<span class="pill s-off">Due ${fmtDate(due)}</span>`;
}
const STORE_KEY = () => `bml-pc-proto-v3-${APP.key}`;
function save() { try { localStorage.setItem(STORE_KEY(), JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function loadSaved() { try { const v = localStorage.getItem(STORE_KEY()); if (v) Object.assign(S, JSON.parse(v)); } catch (e) { /* storage unavailable */ } }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function openModal(html) { $('#modal').innerHTML = `<div class="scrim" data-act="closeModalBg"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#modal input, #modal textarea, #modal select, #modal button'); f && f.focus(); }
function closeModal() { $('#modal').innerHTML = ''; }

function render() {
  if (!UI.tab) UI.tab = Object.fromEntries(Object.entries(APP.tabs).map(([k, v]) => [k, v[0][0]]));
  document.querySelectorAll('.toggle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === UI.view)));
  $('#who').innerHTML = APP.who[UI.view];
  $('#tabs .wrap').innerHTML = APP.tabs[UI.view].map(([id, label]) => {
    const n = APP.badge ? APP.badge(UI.view, id) : '';
    return `<button role="tab" aria-selected="${UI.tab[UI.view] === id}" data-act="tab" data-id="${id}">${esc(label)}${n ? ` (${n})` : ''}</button>`;
  }).join('');
  $('#main .wrap').innerHTML = APP.views[UI.view][UI.tab[UI.view]]();
  save();
}

const ACTIONS = {
  tab: d => { UI.tab[UI.view] = d.id; render(); window.scrollTo({ top: 0 }); },
  closeModal: () => closeModal(),
  resetData: () => { try { localStorage.removeItem(STORE_KEY()); } catch (e) {} location.reload(); },
  closeModalBg: (d, el, e) => { if (e.target === el) closeModal(); },
};

document.addEventListener('click', e => {
  const v = e.target.closest('.toggle button');
  if (v) { UI.view = v.dataset.view; render(); window.scrollTo({ top: 0 }); toast(`Switched to ${VIEW_NAMES[v.dataset.view]} view`); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = ACTIONS[a.dataset.act] || APP.actions[a.dataset.act];
  if (fn) { fn(a.dataset, a, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f, e.submitter).entries());
  APP.forms[f.dataset.form](data, f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// People Manager — manager guidance + HR case management (ER cases, D&G Committee, disciplinary letters)
const STAFF = { name: 'Ahmed Naseer', id: 'EMP 05521', title: 'Branch Manager', dept: 'Retail Banking – Hulhumalé Branch', div: 'Retail Banking', reports: 9 };
const EMP = { name: 'Hussain Shafeeq', id: 'EMP 09456', title: 'Teller', dept: 'Retail Banking – Hulhumalé Branch', div: 'Retail Banking', mgr: 'Ahmed Naseer' };
const TEAM = ['Hussain Shafeeq', 'Aishath Nazla', 'Fathimath Leeza', 'Mohamed Shiyam', 'Hawwa Raufa', 'Teller, EMP 11208'];
const HR_ME = 'Mariyam Shifa (HR)';
const HR_2 = 'Ahmed Ilham (HR)';
const DIVS = ['Retail Banking', 'Operations', 'Corporate Banking', 'Cards & Payments', 'Treasury', 'Risk', 'IT', 'Finance', 'Corporate Services', 'Legal & Compliance', 'People & Culture', 'Internal Audit'];
const LEADS = d => ({ chief: `Chief, ${d}`, director: `Director, ${d}` });
const STAGES = ['Intake', 'Investigation', 'Show cause', 'D&G Committee', 'Decision', 'Closed'];
const SANCTIONS = ['No action', 'Counselling', 'Verbal warning', 'Written warning', 'Final written warning', 'Suspension without pay', 'Demotion', 'Termination'];
const ISSUE_TYPES = ['Conduct concern', 'Performance concern', 'Attendance or absence', 'Grievance in my team', 'Sexual harassment', 'Other'];

// ---- seeded sample of 30 migrated cases (stand-in for the current tracker) ----
function seeded() {
  let x = 7; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280; const pick = a => a[Math.floor(rnd() * a.length)];
  const first = ['Ahmed', 'Mohamed', 'Ibrahim', 'Ali', 'Hussain', 'Hassan', 'Ismail', 'Aminath', 'Fathimath', 'Mariyam', 'Aishath', 'Hawwa', 'Khadeeja', 'Shiyam', 'Nazim', 'Raufa', 'Shifana', 'Zaid'];
  const last = ['Rasheed', 'Naseer', 'Shareef', 'Zahir', 'Faisal', 'Waheed', 'Hameed', 'Latheef', 'Saeed', 'Moosa', 'Didi', 'Manik', 'Adam', 'Jaleel'];
  const allegations = { 'Disciplinary': ['Repeated unauthorised absence', 'Breach of cash handling procedure', 'Misuse of system access', 'Rude conduct towards a customer', 'Failure to follow KYC checks', 'Falsified overtime claim'], 'Grievance (formal)': ['Unfair allocation of overtime', 'Treatment by supervisor', 'Denied training opportunity', 'Shift rota dispute'], 'Grievance (informal)': ['Team communication breakdown', 'Desk move dispute', 'Leave approval delay'], 'Performance': ['Targets missed for three quarters', 'Repeated reconciliation errors'], [SH]: ['Unwelcome comments by a colleague'] };
  const types = ['Disciplinary', 'Disciplinary', 'Disciplinary', 'Grievance (formal)', 'Grievance (informal)', 'Performance', 'Disciplinary', 'Grievance (formal)', SH, 'Disciplinary'];
  const out = [];
  for (let i = 1; i <= 30; i++) {
    const type = types[i % types.length]; const age = Math.floor(rnd() * 160) + 3;
    const closed = i <= 11; const stageIdx = closed ? 5 : type === 'Disciplinary' ? 1 + Math.floor(rnd() * 4) : 1 + Math.floor(rnd() * 2);

    newLetter: d => openModal(`<form data-form="newLetter" data-ref="${d.ref}" style="display:flex;flex-direction:column;gap:12px"><h2>Generate letter</h2><label>Template<select id="nl-t" name="tpl">${S.letterTpls.map(t => `<option value="${t.id}">${esc(t.name)} (v${t.v})</option>`).join('')}</select></label><p class="muted small">Employee, case and hearing details fill in from the case.</p><div class="btns"><button class="btn primary">Create draft</button><button class="btn" type="button" data-act="closeModal">Cancel</button></div></form>`),
    openLetter: d => { const c = caseBy(d.ref); const l = c.letters[+d.i]; const mine = l.drafter === HR_ME;
      openModal(`<div class="head"><h2>${esc(l.name)}</h2><button class="btn sm" data-act="closeModal">Close</button></div>${letterView(c, l, l.status === 'Draft')}
      <div class="btns" style="align-items:center">${l.status === 'Draft' ? `<button class="btn primary" data-act="letterCheck" data-ref="${c.ref}" data-i="${d.i}">Send for second HR check</button>` : ''}${l.status === 'Awaiting check' ? (mine ? `<button class="btn" disabled>Check and issue</button><span class="muted small">You drafted this. A second HR user must check it.</span><button class="btn dark sm" data-act="letterIssue" data-ref="${c.ref}" data-i="${d.i}">Check and issue as ${HR_2}</button>` : `<button class="btn primary" data-act="letterIssue" data-ref="${c.ref}" data-i="${d.i}">Check and issue</button>`) : ''}${l.status === 'Issued' ? `<span class="muted small">Issued ${fmtDate(l.issuedAt)} to the employee's My HR letters.</span>` : ''}</div>
      ${l.status === 'Issued' ? `<dl class="kv"><dt>Acknowledged</dt><dd>${l.ack ? fmtDate(l.ack.at) + ' by the employee in ESS' : l.handDelivered ? `Hand delivered ${fmtDate(l.handDelivered.at)} by ${esc(l.handDelivered.by)}` : 'Not yet'}</dd>${l.tpl === 'sc' ? `<dt>Explanation</dt><dd>${l.reply ? `Received ${fmtDate(l.reply.at)}` : `Due ${fmtDate(addWorkDays(l.issuedAt, 3))}`}</dd>` : ''}</dl>
      ${l.reply ? `<div class="msg"><div class="by">Employee's written explanation</div>${esc(l.reply.t)}</div>` : ''}
      ${!l.ack && !l.handDelivered ? `<div class="btns"><button class="btn sm" data-act="handDeliver" data-ref="${c.ref}" data-i="${d.i}">Record hand delivery</button><span class="small muted">Use if the employee has not acknowledged within ${S.ackDays} working days.</span></div>` : ''}` : ''}`); },
    ackLetter: d => { const c = caseBy(d.ref); const l = c.letters[+d.i]; l.ack = { at: today.toISOString() }; c.log.push({ at: today.toISOString(), by: c.employee, t: `${l.name} (${l.ref}) acknowledged in ESS.` }); render(); toast('Acknowledged. HR has been told'); },
    handDeliver: d => { const c = caseBy(d.ref); const l = c.letters[+d.i]; l.handDelivered = { at: today.toISOString(), by: HR_ME }; c.log.push({ at: today.toISOString(), by: HR_ME, t: `${l.name} (${l.ref}) delivered by hand.` }); closeModal(); render(); toast('Hand delivery recorded'); },
    letterCheck: d => { const c = caseBy(d.ref); const l = c.letters[+d.i]; const b = $('#letter-body'); if (b) l.body = b.value; l.status = 'Awaiting check'; c.log.push({ at: today.toISOString(), by: HR_ME, t: `${l.name} sent for check.` }); closeModal(); render(); toast('Sent for second HR check'); },
    letterIssue: d => { const c = caseBy(d.ref); const l = c.letters[+d.i]; l.ref = makeRef('PC/DL'); l.status = 'Issued'; l.issuedAt = today.toISOString(); l.checker = l.drafter === HR_ME ? HR_2 : HR_ME; c.log.push({ at: today.toISOString(), by: l.checker, t: `${l.name} issued, ${l.ref}.` }); closeModal(); render(); toast(`Letter ${l.ref} issued`); },
    editTopic: d => { S.editTopic = d.id || null; render(); },
    toggleTopic: d => { const t = topic(d.id); t.active = !t.active; render(); toast(t.active ? 'Topic restored' : 'Topic retired; managers no longer see it'); },
  },
  forms: {
    scReply: (data, f) => { const c = caseBy(f.dataset.ref); const l = c.letters[+f.dataset.i]; l.reply = { t: data.t, at: today.toISOString() }; c.done = c.done || {}; const idx = (S.caseTypes[c.type]?.steps || []).findIndex(s => /reply/i.test(s[0])); if (idx >= 0) c.done[idx] = today.toISOString(); c.log.push({ at: today.toISOString(), by: c.employee, t: `Written explanation submitted for ${l.ref}.` }); render(); toast('Explanation submitted to HR'); },
    ask: data => {
      const report = S.askKind === 'Report'; const ref = makeRef('PM'); const sh = data.issue === SH;
      S.requests.unshift({ ref, kind: report ? 'Report' : 'Advice', issue: report ? data.issue : 'Advice', topic: S.askTopic || 'other', mgr: STAFF.name, sid: STAFF.id, div: STAFF.div, urgency: data.urgency, status: 'New', at: today.toISOString(), text: data.text, emp: data.emp, route: ['HR', ...(!sh && data.chief ? ['Division Chief'] : []), ...(!sh && data.director ? ['Division Director'] : [])], msgs: [] });
      S.askTopic = undefined; S.topicSel = null; UI.tab.manager = 'mine'; render(); toast(`Sent to HR. Your reference is ${ref}`);
    },
    mgrMsg: (data, f) => { const r = reqBy(f.dataset.ref); r.msgs.push({ by: 'Mgr', t: data.t }); render(); toast('Reply sent to HR'); },
    hrReply: (data, f) => { const r = reqBy(f.dataset.ref); r.msgs.push({ by: 'HR', t: data.t }); if (!r.caseRef) r.status = 'Responded'; render(); toast('Reply sent to the manager'); },
    noCase: (data, f) => { const r = reqBy(f.dataset.ref); r.msgs.push({ by: 'HR', t: data.t }); r.status = 'Closed'; closeModal(); render(); toast('Closed with advice; no case opened'); },
    newCase: (data, f) => {
      const src = f.dataset.src; const c = createCase(data, { raisedBy: src ? 'Line manager' : 'HR', source: src || null });
      if (src) { const r = reqBy(src); r.caseRef = c.ref; r.status = 'Case opened'; r.msgs.push({ by: 'HR', t: 'Thank you. HR has opened a case and will contact you if we need anything further.' }); }
      closeModal(); UI.tab.hr = 'cases'; S.caseSel = c.ref; render(); toast(`Case ${c.ref} opened`);
    },
    caseRoute: (data, f) => { const c = caseBy(f.dataset.ref); c.route = ['HR', ...(data.chief ? ['Division Chief'] : []), ...(data.director ? ['Division Director'] : [])]; c.log.push({ at: today.toISOString(), by: HR_ME, t: `Shared with: ${routeTxt(c.route, c.div)}.` }); closeModal(); render(); toast('Sharing updated'); },
    dg: (data, f) => { const c = caseBy(f.dataset.ref); const first = !c.dg; c.dg = true; c.dgDate = new Date(data.date).toISOString(); c.dgDecision = data.decision || null; if (first) { c.stage = 'D&G Committee'; if (!c.route.includes('Division Director') && c.type !== SH) c.route.push('Division Director'); } c.log.push({ at: today.toISOString(), by: HR_ME, t: first ? `Referred to D&G Committee; hearing ${fmtDate(c.dgDate)}.` : `D&G Committee updated${c.dgDecision ? ': decision ' + c.dgDecision : ''}.` }); closeModal(); render(); toast(first ? 'Referred to D&G Committee' : 'D&G details saved'); },
    decide: (data, f) => { const c = caseBy(f.dataset.ref); c.sanction = data.sanction; c.stage = 'Closed'; c.closedAt = today.toISOString(); c.log.push({ at: today.toISOString(), by: HR_ME, t: `Closed. Decision: ${data.sanction}.${data.notes ? ' ' + data.notes : ''}` }); closeModal(); render(); toast('Case closed'); },
    newLetter: (data, f) => { const c = caseBy(f.dataset.ref); const t = S.letterTpls.find(x => x.id === data.tpl); c.letters.push({ tpl: t.id, name: t.name, v: t.v, body: fillLetter(t, c), status: 'Draft', drafter: HR_ME }); c.log.push({ at: today.toISOString(), by: HR_ME, t: `Draft created: ${t.name}.` }); closeModal(); render(); APP.actions.openLetter({ ref: c.ref, i: String(c.letters.length - 1) }); },
    caseNote: (data, f) => { caseBy(f.dataset.ref).log.push({ at: today.toISOString(), by: HR_ME, t: data.t }); render(); toast('Added to case log'); },
    saveTopic: (data, f) => {
      const vals = { name: data.name, group: data.group, policy: data.policy, steps: data.steps.split('\n').map(s => s.trim()).filter(Boolean), forms: data.forms.split('\n').map(s => s.trim()).filter(Boolean), reviewed: today.toISOString().slice(0, 10) };
      if (f.dataset.id === 'new') S.topics.push({ id: 't' + Date.now(), views: 0, active: true, ...vals }); else Object.assign(topic(f.dataset.id), vals);
      S.editTopic = null; render(); toast(`${vals.name} published`);
    },
    saveAck: data => { S.ackDays = Math.max(1, +data.ackDays || 2); render(); toast('Saved'); },
    saveTypes: data => { Object.entries(S.caseTypes).forEach(([k, t], i) => { t.timebound = k === SH || k === 'Grievance (formal)' ? true : !!data['tb_' + i]; t.steps.forEach((s, j) => { s[1] = Math.max(0, +data[`d_${i}_${j}`] || 0); }); }); render(); toast('Timelines saved; due dates updated'); },
  },
};
document.addEventListener('input', e => {
  if (e.target.dataset.live === 'search') { S.search = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.live === 'cf') { S.caseFilter[e.target.dataset.k] = e.target.value; render(); }
  if (e.target.dataset.live === 'issue') { const sh = e.target.value === SH; ['#a-chief', '#a-director'].forEach(s => { const i = $(s); i.disabled = sh; if (sh) i.checked = false; }); $('#route-note').hidden = !sh; }
});

loadSaved();
render();
</script>
